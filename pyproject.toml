[project]
name = "morgenmcp"
dynamic = ["version"]
description = "Unofficial MCP server for the Morgen calendar API"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [
    { name = "The Morgen MCP Authors" },
]
keywords = [
    "mcp",
    "model-context-protocol",
    "morgen",
    "calendar",
    "fastmcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business :: Scheduling",
]
dependencies = [
    "fastmcp>=3.4,<3.5",
    "httpx>=0.28",
    "platformdirs>=4.0",
    "pydantic>=2.12",
    "tzdata>=2025.1",
]

[project.urls]
Homepage = "https://github.com/k3KAW8Pnf7mkmdSMPHz27/MorgenMCP"
Repository = "https://github.com/k3KAW8Pnf7mkmdSMPHz27/MorgenMCP"
Issues = "https://github.com/k3KAW8Pnf7mkmdSMPHz27/MorgenMCP/issues"
Documentation = "https://github.com/k3KAW8Pnf7mkmdSMPHz27/MorgenMCP#readme"

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "respx>=0.22",
    "ruff>=0.16.6,<0.17",
    "pre-commit>=4.0",
    "pyright>=1.1.408",
]

[project.scripts]
morgenmcp = "morgenmcp.server:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.hooks.vcs]
version-file = "morgenmcp/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["morgenmcp"]

[tool.uv]
package = true
prerelease = "if-necessary"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: tests that hit the real Morgen API (deselect with '-m not integration')",
]
addopts = "-m 'not integration'"

[tool.ruff]
target-version = "py312"
line-length = 88

# ruff 0.16 formats Markdown code blocks; neither tree is ours to reformat.
exclude = ["docs", ".claude", "skills"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter, docstrings exempt)
]

[tool.ruff.lint.isort]
known-first-party = ["morgenmcp"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
include = ["morgenmcp"]
venvPath = "."
venv = ".venv"
