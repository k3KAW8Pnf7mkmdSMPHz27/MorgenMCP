name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # "3.14" is the newest supported; "3.12" is requires-python's floor.
        # Testing both ends means syntax or stdlib newer than the floor fails
        # here rather than in a user's install.
        python-version: ["3.14"]
        include:
          - os: ubuntu-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check formatting with ruff
        run: uv run ruff format --check .

      - name: Type check with pyright
        run: uv run pyright

      - name: Run tests
        run: uv run pytest
