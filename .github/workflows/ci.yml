name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.14"]
        include:
          # Also test requires-python's floor, so newer syntax fails here.
          - os: ubuntu-latest
            python-version: "3.12"

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check formatting with ruff
        run: uv run ruff format --check .

      - name: Type check with pyright
        run: uv run pyright

      - name: Run tests
        run: uv run pytest

  bundle:
    name: Desktop bundle checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - name: Build a development wheel for packaging checks
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: '0.0.0'
        run: uv build --wheel
      - name: Validate and pack development bundle
        run: |
          set -euo pipefail
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          python3 -m scripts.build_bundle \
            --wheel "${wheels[0]}" --tag v0.0.0 --destination build/desktop
          npm exec --yes --ignore-scripts --package=@anthropic-ai/mcpb@2 -- \
            mcpb pack build/desktop build/development.mcpb
      - name: Check isolated bundle launcher without API calls
        run: uv run --directory build/desktop server.py --help
