name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          # No python-version here on purpose. The input sets UV_PYTHON, which
          # overrides `.python-version` — so pinning it here would silently
          # defeat the repo's own pin and let the two drift. Omitted, uv reads
          # `.python-version` (currently 3.14.2), matching local development
          # and release.yml.
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras

      - name: Confirm the interpreter matches .python-version
        shell: bash
        run: |
          pinned=$(cat .python-version)
          actual=$(uv run python -c 'import sys; print(".".join(map(str, sys.version_info[:3])))')
          echo "pinned=$pinned actual=$actual"
          [ "$pinned" = "$actual" ] || { echo "::error::CI is running $actual but .python-version pins $pinned"; exit 1; }

      - name: Lint with ruff
        run: uv run ruff check .

      - name: Check formatting with ruff
        run: uv run ruff format --check .

      - name: Type check with pyright
        run: uv run pyright

      - name: Run tests
        run: uv run pytest
