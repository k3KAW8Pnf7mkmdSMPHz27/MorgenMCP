name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  MCPB_VERSION: '2.1.2'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Validate stable release tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release workflow only supports stable vX.Y.Z tags. Got: $GITHUB_REF_NAME"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --all-extras
      - run: uv run pytest

  release:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Validate stable release tag
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release workflow only supports stable vX.Y.Z tags. Got: $GITHUB_REF_NAME"
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install pinned bundle tooling
        run: npm install --global --ignore-scripts "@anthropic-ai/mcpb@$MCPB_VERSION"

      - name: Build sdist and wheel
        run: uv build

      - name: Stage, validate, and pack desktop bundle
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          uv run --no-project python -m scripts.build_bundle \
            --wheel "${wheels[0]}" --tag "$RELEASE_TAG" --destination build/desktop
          mcpb validate build/desktop/manifest.json
          mcpb pack build/desktop "dist/morgenmcp-${RELEASE_TAG#v}.mcpb"

      - name: Checksum final release files
        working-directory: dist
        run: sha256sum *.whl *.tar.gz *.mcpb > SHA256SUMS

      - name: Sign release provenance with Sigstore
        id: provenance
        uses: actions/attest@v4
        with:
          create-storage-record: false
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/*.mcpb
            dist/SHA256SUMS

      - name: Save verification material alongside release files
        env:
          BUNDLE_PATH: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE_PATH" dist/provenance.sigstore.json

      - name: Require verified provenance before publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          uv run --no-project python -m scripts.verify_release \
            --bundle dist/provenance.sigstore.json \
            --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" \
            --repository "$GITHUB_REPOSITORY" \
            dist/*.whl dist/*.tar.gz dist/*.mcpb dist/SHA256SUMS

      - name: Preserve verified release files for recovery
        uses: actions/upload-artifact@v7
        with:
          name: verified-release-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Publish Python distributions with trusted publishing
        run: uv publish dist/*.whl dist/*.tar.gz

      - name: Publish GitHub Release with provenance verification material
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "$RELEASE_TAG"
